name: OpenXR runtime (Monado)

# Runs the Monado build with the ALVR driver + compositor enabled. Separate
# from rust.yml because it's slower (vcpkg manifest install on cold cache is
# 15-45 min). Path-gated for PRs so non-OpenXR work doesn't pay the cost —
# only PRs that touch the bridge crate, xtask, openxr submodule, or this
# workflow itself trigger the job.

on:
  push:
    branches: [openxr, master]
  pull_request:
    branches: [openxr, master]
    paths:
      - 'alvr/server_openxr/**'
      - 'alvr/server_core/src/metrics_exporter.rs'
      - 'alvr/launcher/**'
      - 'alvr/xtask/src/build_openxr.rs'
      - 'openxr'
      - '.github/workflows/openxr.yml'
      - 'Cargo.lock'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # The `openxr/` submodule is a private fork (AndreyVN/monado @ alvr
      # branch) that the default GITHUB_TOKEN can't reach. Repo settings
      # must define a `MONADO_PAT` Actions secret containing a PAT with
      # at least `Contents: read` on AndreyVN/monado (fine-grained PAT)
      # or the classic `repo` scope. Without it the submodule clone 404s
      # and every subsequent step is skipped.
      - uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.MONADO_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # vcpkg's installed/ tree is what the per-port builds produce; caching
      # it across runs keeps the build under 5 min once warm. The cache key
      # is the hash of Monado's vcpkg.json + builtin-baseline — change either
      # and we rebuild from scratch.
      - name: Cache vcpkg installs
        uses: actions/cache@v4
        with:
          path: build/_thirdparty/vcpkg/installed
          key: vcpkg-windows-${{ hashFiles('openxr/vcpkg.json') }}

      - name: Prepare ALVR deps
        env:
          RUST_BACKTRACE: 1
        run: cargo xtask prepare-deps --platform windows

      # prepare-deps `choco install vulkan-sdk`s the LunarG SDK, but choco sets
      # VULKAN_SDK / PATH at the machine level mid-job and GitHub Actions does
      # not surface that to later steps. Export it explicitly so the cdylib's
      # encoder skeleton sees VULKAN_SDK and Monado's SPIR-V.cmake finds
      # glslangValidator.exe (in <sdk>\Bin) — without this the runtime build
      # fails at configure with "glslangValidator required".
      - name: Export Vulkan SDK to environment
        shell: pwsh
        run: |
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) {
            Write-Error "Vulkan SDK not found under C:\VulkanSDK after prepare-deps (expected choco install vulkan-sdk)."
            exit 1
          }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$($sdk.FullName)\Bin"       | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "VULKAN_SDK=$($sdk.FullName)"
          & "$($sdk.FullName)\Bin\glslangValidator.exe" --version

      # The Monado-side ALVR driver + compositor link against this cdylib;
      # build it first so the .dll.lib import lib exists for the IMPORTED
      # target in drivers/alvr/CMakeLists.txt and compositor/alvr/CMakeLists.txt.
      - name: Build alvr_server_openxr cdylib
        run: cargo build -p alvr_server_openxr

      # OpenXR-mode-specific Rust unit tests: launcher session.json runtime-mode
      # round-trip (8 tests in alvr/launcher/src/actions.rs), metrics_exporter
      # aggregators for OxrPacing / OxrLayerTypes / Battery (8 tests in
      # alvr/server_core/src/metrics_exporter.rs), and bridge-pose guards in
      # alvr/server_openxr/src/lib.rs (pin AlvrOxrPose::default + the head/view
      # getters to a normalized quaternion — the zero-quat that surfaced as an
      # xrLocateViews RUNTIME_FAILURE). All exist because of this fork's OpenXR
      # mode work and have no other CI coverage.
      - name: Run OpenXR-mode unit tests
        run: |
          cargo test -p alvr_launcher
          cargo test -p alvr_server_core metrics_exporter
          cargo test -p alvr_server_openxr

      - name: Build OpenXR runtime
        env:
          RUST_BACKTRACE: 1
        run: cargo xtask build-openxr-runtime --enable-alvr-driver

      # Runs Monado's own CTest suite (25 binaries, ~3759 assertions). Each
      # test was registered with `--success --allow-running-no-tests` in
      # openxr/tests/CMakeLists.txt, so the GPU-only `[.][needgpu]` cases
      # (D3D11/12 + Vulkan compositor clients) report "No tests ran" and
      # exit 0 on the GPU-less Actions runner instead of failing. Real-GPU
      # coverage of those cases lives on the 192.168.10.101 dev host.
      - name: Run Monado test suite
        working-directory: build/openxr-debug
        run: ctest -C Debug --output-on-failure
